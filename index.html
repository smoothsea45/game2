<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183b35">
  <title>한성가록 · 운종가의 하루</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="masthead">
  <div class="brand"><span class="seal" aria-hidden="true">漢城<br>家錄</span><div><h1>한성가록</h1><p class="brand-place">한성부 · 운종가</p></div></div>
  <div class="timebar">
    <div class="calendar"><span>선조 33년</span><b id="day">첫째 날</b></div>
    <div class="hour"><span data-icon="sun"></span><strong id="time">07:00</strong></div>
    <div class="speeds" aria-label="시간 조작">
      <button type="button" id="pause" aria-label="일시정지" title="일시정지 (스페이스)"><span data-icon="pause"></span></button>
      <button type="button" data-speed="1" aria-pressed="true">1×</button><button type="button" data-speed="2" aria-pressed="false">2×</button><button type="button" data-speed="4" aria-pressed="false">4×</button>
    </div>
  </div>
  <button type="button" class="help-button" id="help" aria-label="게임 안내"><span data-icon="book"></span><span>게임 안내</span></button>
</header>
<main>
  <div class="atlas">
    <section class="map-shell" aria-label="운종가 실시간 지도">
      <div id="world">
        <div id="scene" aria-label="한성의 거리와 인물"></div>
        <div class="map-plate"><span class="map-region">漢城府</span><strong>운종가</strong></div>
        <div id="pause-badge" hidden>시간이 멈췄습니다</div>
        <div class="camera" id="camera-tools" aria-label="지도 보기 조정">
          <button type="button" data-camera="reset" title="지도 전체 보기" aria-label="지도 전체 보기"><span data-icon="frame"></span></button>
          <button type="button" data-camera="left" title="왼쪽으로 회전" aria-label="왼쪽으로 회전"><span data-icon="rotateLeft"></span></button>
          <button type="button" data-camera="right" title="오른쪽으로 회전" aria-label="오른쪽으로 회전"><span data-icon="rotateRight"></span></button>
          <button type="button" data-camera="zoomIn" title="확대" aria-label="지도 확대"><span data-icon="plus"></span></button>
          <button type="button" data-camera="zoomOut" title="축소" aria-label="지도 축소"><span data-icon="minus"></span></button>
        </div>
        <div class="world-toast" role="status" aria-live="polite" id="toast" hidden></div>
      </div>
      <button id="journal-open" class="news" type="button" aria-label="가문 일지 열기"><span class="news-label"><span data-icon="feather"></span>가문 일지</span><time id="news-time"></time><span id="news-text">한성의 아침이 밝았습니다.</span><span data-icon="arrowRight"></span></button>
      <div class="inventory" id="inventory" aria-label="가문 재산과 재고"></div>
    </section>
    <aside class="desk" aria-label="가문 지휘">
      <section class="mission">
        <div class="mission-head"><h2><span data-icon="flag"></span> 첫 거래</h2><span id="goal-count"></span></div>
        <p id="goal-text"></p><div class="goal-track" id="goal-track" aria-hidden="true"><i></i><i></i><i></i></div>
      </section>
      <section class="people">
        <h2 class="section-title">인물 선택</h2>
        <div id="roster" aria-label="인물 선택"></div>
      </section>
      <section class="command" id="command-card" aria-labelledby="actor-name"><div class="command-body">
        <div class="identity"><img id="active-portrait" alt=""><div><span class="person-role" id="actor-role"></span><h2 id="actor-name"></h2></div><button id="follow" type="button" class="track-button" aria-pressed="false"><span data-icon="target"></span> 따라가기</button><button type="button" id="command-close" aria-label="인물 명령 닫기"><span data-icon="close"></span></button></div>
        <div id="state-line"><span class="status-dot"></span><span id="actor-status"></span></div>
        <div class="work-meter" id="work-meter" hidden><i></i></div>
        <div class="action-list" id="actions"></div>
        <div id="travel"><label for="destination">이동 지시</label><div><select id="destination"></select><button id="go" type="button">보내기 <span aria-hidden="true">→</span></button></div></div>
      </div></section>
    </aside>
  </div>
  <nav class="pocket-bar" aria-label="지도 도구">
    <button type="button" data-pocket="goal" aria-label="목표 열기" aria-expanded="false" aria-controls="book-dialog"><span data-icon="flag"></span><span>목표</span></button>
    <button type="button" data-pocket="stock" aria-label="재고 열기" aria-expanded="false" aria-controls="book-dialog"><span data-icon="stall"></span><span>재고</span></button>
    <button type="button" data-pocket="log" aria-label="일지 열기" aria-expanded="false" aria-controls="book-dialog"><span data-icon="feather"></span><span>일지</span></button>
    <button type="button" id="camera-open" aria-label="시점 조절" aria-expanded="false" aria-controls="camera-tools"><span data-icon="frame"></span><span>시점</span></button>
    <button type="button" data-pocket="help" aria-label="도움말 열기" aria-expanded="false" aria-controls="book-dialog"><span data-icon="book"></span><span>도움</span></button>
  </nav>
  <div class="footnote"><span><span data-icon="pointer"></span> <span id="map-hint">인물을 선택하고 길이나 건물을 눌러 이동하세요.</span></span><span id="save-state"></span></div>
</main>
<dialog id="book-dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close" aria-label="닫기"><span data-icon="close"></span></button></div><div id="dialog-content"></div></dialog>
<script type="module" src="./app.js"></script>
</body>
</html>
